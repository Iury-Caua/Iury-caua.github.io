<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <title>Cidade Interativa - Engenharia Mecânica UFC (Escala Real)</title>
    <!-- Biblioteca A-Frame 1.4.0 -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>

    <style>
      #joystick-zone {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 40%;
  height: 40%; /* Ocupa a metade de baixo da tela */
  z-index: 998; /* Fica abaixo do HUD */
  touch-action: none;
}
/* Evitar que o HUD bloqueie os toques do joystick nas bordas */
#vr-hud {
  pointer-events: auto;
}
      #vr-hud {
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 999;
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: rgba(15, 23, 42, 0.9);
        color: #f8fafc;
        padding: 18px 24px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.6);
        border: 1px solid rgba(56, 189, 248, 0.3);
        max-width: 420px;
        backdrop-filter: blur(10px);
      }
      #hud-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      #vr-hud h1 {
        font-size: 1.2rem;
        margin: 0 0 6px 0;
        color: #38bdf8;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      #hud-header h1 { margin: 0; }
      .hud-btn-min {
        flex-shrink: 0;
        background: transparent;
        color: #38bdf8;
        border: 1px solid rgba(56, 189, 248, 0.5);
        border-radius: 6px;
        width: 30px;
        height: 30px;
        font-size: 1rem;
        line-height: 1;
        cursor: pointer;
        margin: 0;
        padding: 0;
      }
      .hud-btn-min:hover { background: rgba(56, 189, 248, 0.15); }
      #vr-hud.hud-minimizado {
        max-width: 220px;
        padding: 12px 16px;
      }
      #vr-hud.hud-minimizado #hud-body {
        display: none;
      }
      #vr-hud p {
        font-size: 0.9rem;
        margin: 6px 0;
        color: #cbd5e1;
        line-height: 1.4;
      }
      .hud-btn {
        background: #0284c7;
        color: white;
        border: none;
        padding: 10px 14px;
        margin-top: 12px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
        font-size: 0.85rem;
        transition: all 0.2s;
        margin-right: 6px;
      }
      .hud-btn:hover { background: #0369a1; transform: translateY(-1px); }
      .hud-btn.danger { background: #dc2626; }
      .hud-btn.danger:hover { background: #b91c1c; }
      #card-detalhes {
        margin-top: 10px;
        padding: 10px;
        background: rgba(30, 41, 59, 0.8);
        border-left: 4px solid #38bdf8;
        border-radius: 4px;
        font-size: 0.82rem;
        display: none;
      }
    </style>

    <script>
      // SINTETIZADOR DE ÁUDIO WEB AUDIO API
      const SoundFX = {
        ctx: null,
        init() {
          if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        },
        playChime(freq = 587.33, duration = 0.25) {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        },
        playAlarm() {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, this.ctx.currentTime);
          osc.frequency.linearRampToValueAtTime(110, this.ctx.currentTime + 0.35);
          gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.35);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.35);
        }
      };

      window.DisciplinasMap = {};
      window.ModoConflitoAtivo = false;
      window.DisciplinaSelecionadaAtual = null;

      // COMPONENTE ARQUITETÔNICO DE DISCIPLINA (PRÉDIO REAL)
      AFRAME.registerComponent('edificio-disciplina', {
        schema: {
          codigo: {type: 'string', default: ''},
          nome: {type: 'string', default: ''},
          semestre: {type: 'string', default: ''},
          creditos: {type: 'string', default: ''},
          ch: {type: 'string', default: ''},
          prerequisitos: {type: 'array', default: []},
          descricao: {type: 'string', default: ''},
          corPadrao: {type: 'string', default: '#1e293b'}
        },

        init: function () {
          const el = this.el;
          const data = this.data;

          window.DisciplinasMap[data.codigo] = this;

          this.corpoPredio = el.querySelector('.predio-corpo');
          this.placaFacade = el.querySelector('.placa-facade');
          this.textoNome = el.querySelector('.texto-nome');
          this.porta = el.querySelector('.porta');

          // --- EXPANSÃO DA ÁREA DE CLIQUE (HITBOX INVISÍVEL AMPLA) ---
          const hitBox = document.createElement('a-box');
          hitBox.setAttribute('class', 'interativo click-hitbox');
          hitBox.setAttribute('width', '7.5');
          hitBox.setAttribute('height', '5.5');
          hitBox.setAttribute('depth', '6.5');
          hitBox.setAttribute('position', '0 2.5 0');
          hitBox.setAttribute('material', 'visible: false');
          el.appendChild(hitBox);

          // Marca todos os elementos internos como interativos
          el.querySelectorAll('*').forEach(child => {
            child.classList.add('interativo');
          });

          // --- CRIAÇÃO DO CARD 3D FLUTUANTE ACIMA DO PRÉDIO ---
          this.card3D = document.createElement('a-entity');
          this.card3D.setAttribute('position', '0 6.2 0');
          this.card3D.setAttribute('visible', 'false');

          const bgPlane = document.createElement('a-plane');
          bgPlane.setAttribute('width', '7');
          bgPlane.setAttribute('height', '2.6');
          bgPlane.setAttribute('color', '#0f172a');
          bgPlane.setAttribute('material', 'opacity: 0.93; transparent: true; side: double');

          const borderPlane = document.createElement('a-plane');
          borderPlane.setAttribute('width', '7.1');
          borderPlane.setAttribute('height', '2.7');
          borderPlane.setAttribute('position', '0 0 -0.01');
          borderPlane.setAttribute('color', '#38bdf8');
          borderPlane.setAttribute('material', 'opacity: 0.8; transparent: true; side: double');

          this.cardTexto3D = document.createElement('a-text');
          this.cardTexto3D.setAttribute('align', 'center');
          this.cardTexto3D.setAttribute('position', '0 0 0.05');
          this.cardTexto3D.setAttribute('width', '6.5');
          this.cardTexto3D.setAttribute('color', '#ffffff');
          this.cardTexto3D.setAttribute('wrap-count', '32');

          this.card3D.appendChild(borderPlane);
          this.card3D.appendChild(bgPlane);
          this.card3D.appendChild(this.cardTexto3D);
          el.appendChild(this.card3D);

          // Eventos de Interação
          el.addEventListener('click', (evt) => {
            evt.stopPropagation();
            const codigoClicado = data.codigo;

            // Se a disciplina clicada já é a que está selecionada, desativa o efeito
            if (window.DisciplinaSelecionadaAtual === codigoClicado) {
              window.resetarCenario();
              return;
            }

            if (window.ModoConflitoAtivo) {
              this.simularImpactoTrancamento();
            } else {
              this.executarEfeitoCascata();
            }
            // Definido depois do efeito, pois executarEfeitoCascata/simularImpactoTrancamento
            // chamam resetarCenario() internamente, o que zeraria a seleção se fosse antes.
            window.DisciplinaSelecionadaAtual = codigoClicado;
          });

          el.addEventListener('mouseenter', () => {
            el.setAttribute('scale', '1.03 1.03 1.03');
          });
          el.addEventListener('mouseleave', () => {
            el.setAttribute('scale', '1 1 1');
          });
        },

        exibirCard3D: function () {
          if (!this.card3D) return;
          const data = this.data;
          const reqStr = (data.prerequisitos && data.prerequisitos.length > 0) ? data.prerequisitos.join(', ') : 'Nenhum';
          const texto = `[ ${data.codigo} - ${data.nome} ]\nSemestre: ${data.semestre}º | CH: ${data.ch} (${data.creditos} cr)\nPré-req: ${reqStr}\n${data.descricao}`;
          
          this.cardTexto3D.setAttribute('value', texto);
          this.card3D.setAttribute('visible', 'true');
        },

        // ALGORITMO RECURSIVO DE CASCATA
        executarEfeitoCascata: function () {
          window.resetarCenario();
          SoundFX.playChime(659.25, 0.3);

          const codigoAlvo = this.data.codigo;
          this.exibirCard3D();

          // 1. Obter Pré-requisitos Ancestrais
          const prereqsAncestrais = new Set();
          function buscarPrereqs(cod) {
            const disc = window.DisciplinasMap[cod];
            if (!disc) return;
            (disc.data.prerequisitos || []).forEach(req => {
              if (!prereqsAncestrais.has(req)) {
                prereqsAncestrais.add(req);
                buscarPrereqs(req);
              }
            });
          }
          buscarPrereqs(codigoAlvo);

          // 2. Obter Dependentes Sucessores
          const dependentesSucessores = new Set();
          function buscarDependentes(cod) {
            Object.keys(window.DisciplinasMap).forEach(k => {
              const disc = window.DisciplinasMap[k];
              if (disc.data.prerequisitos && disc.data.prerequisitos.includes(cod)) {
                if (!dependentesSucessores.has(k)) {
                  dependentesSucessores.add(k);
                  buscarDependentes(k);
                }
              }
            });
          }
          buscarDependentes(codigoAlvo);

          // 3. Renderizar Efeitos Visuais (Altera o CORPO do prédio)
          Object.keys(window.DisciplinasMap).forEach(k => {
            const edif = window.DisciplinasMap[k];

            if (k === codigoAlvo) {
              // Prédio Selecionado (Destaque Verde Esmeralda)
              edif.setAparencia('#10b981', '#059669', 1.0);
            } else if (prereqsAncestrais.has(k)) {
              // Pré-requisito (Vermelho Coral)
              edif.setAparencia('#ef4444', '#dc2626', 0.95);
            } else if (dependentesSucessores.has(k)) {
              // Dependente Futuro (Azul Ciano)
              edif.setAparencia('#06b6d4', '#0284c7', 0.95);
            } else {
              // Unidade Não Relacionada (Esmaecida)
              edif.setAparencia('#334155', '#0f172a', 0.25);
            }
          });

          // Atualizar Interface HUD
          const hudStatus = document.getElementById('hud-status');
          const cardDetalhes = document.getElementById('card-detalhes');
          if (hudStatus) {
            hudStatus.innerHTML = `Pavilhão: <b style="color:#10b981;">${this.data.codigo} - ${this.data.nome}</b><br>` +
              `• Pré-requisitos na cadeia: <b style="color:#ef4444;">${prereqsAncestrais.size}</b><br>` +
              `• Disciplinas desbloqueadas no futuro: <b style="color:#06b6d4;">${dependentesSucessores.size}</b>`;
          }
          if (cardDetalhes) {
            cardDetalhes.style.display = 'block';
            cardDetalhes.innerHTML = `<b>Semestre:</b> ${this.data.semestre}º | <b>CH:</b> ${this.data.ch} (${this.data.creditos} cr)<br>` +
              `<b>Ementa:</b> ${this.data.descricao}`;
          }
        },

        // SIMULADOR DE CONFLITO / TRANCAMENTO EM CASCATA
        simularImpactoTrancamento: function () {
          window.resetarCenario();
          SoundFX.playAlarm();

          const codigoRaiz = this.data.codigo;
          this.exibirCard3D();

          const bloqueadas = new Set();
          function travarSucessores(cod) {
            Object.keys(window.DisciplinasMap).forEach(k => {
              const d = window.DisciplinasMap[k];
              if (d.data.prerequisitos && d.data.prerequisitos.includes(cod)) {
                if (!bloqueadas.has(k)) {
                  bloqueadas.add(k);
                  travarSucessores(k);
                }
              }
            });
          }
          travarSucessores(codigoRaiz);

          this.setAparencia('#dc2626', '#991b1b', 1.0);

          bloqueadas.forEach(codBloq => {
            const comp = window.DisciplinasMap[codBloq];
            comp.setAparencia('#f97316', '#ea580c', 0.9);
          });

          const hudStatus = document.getElementById('hud-status');
          if (hudStatus) {
            hudStatus.innerHTML = `<span style="color:#ef4444; font-weight:bold;">ALERTA DE TRANCAMENTO (${codigoRaiz}):</span><br>` +
              `A reprovação/trancamento nesta disciplina trava instantaneamente <b style="color:#f97316;">${bloqueadas.size}</b> disciplinas futuras na matriz!`;
          }
        },

        getPosicaoTopo: function () {
          const pos = new THREE.Vector3();
          this.el.object3D.getWorldPosition(pos);
          pos.y += 4.2;
          return pos;
        },

        // APLICA COR AO CORPO DO PRÉDIO (corpoPredio)
        setAparencia: function (corHex, corEmissive, opacidade) {
          if (this.corpoPredio) {
            this.corpoPredio.setAttribute('material', {
              color: corHex,
              emissive: corEmissive,
              emissiveIntensity: opacidade > 0.5 ? 0.35 : 0.05,
              opacity: opacidade,
              transparent: opacidade < 1,
              roughness: 0.5
            });
          }
          if (this.placaFacade) {
            this.placaFacade.setAttribute('material', {
              color: corHex,
              emissive: corEmissive,
              emissiveIntensity: opacidade > 0.5 ? 0.6 : 0.1,
              opacity: opacidade,
              transparent: opacidade < 1
            });
          }
          if (this.porta) {
            this.porta.setAttribute('material', {
              color: corHex,
              emissive: corEmissive,
              emissiveIntensity: opacidade > 0.5 ? 0.6 : 0.1,
              opacity: opacidade,
              transparent: opacidade < 1
            });
          }
        },

        resetarEstilo: function () {
          if (this.corpoPredio) {
            this.corpoPredio.setAttribute('material', {
              color: this.data.corPadrao || '#1e293b',
              emissive: '#000000',
              emissiveIntensity: 0,
              opacity: 1.0,
              transparent: false,
              roughness: 0.5
            });
          }
          if (this.placaFacade) {
            this.placaFacade.setAttribute('material', {
              color: '#0f172a',
              emissive: '#000000',
              emissiveIntensity: 0,
              opacity: 1.0,
              transparent: false
            });
          }
          if (this.porta) {
            this.porta.setAttribute('material', {
              color: '#624e34',
              emissive: '#000000',
              emissiveIntensity: 0,
              opacity: 1.0,
              transparent: false
            });
          }
          if (this.card3D) {
            this.card3D.setAttribute('visible', 'false');
          }
          this.el.setAttribute('scale', '1 1 1');
        }
      });

      // COMPONENTE DE PONTO DE TELETRANSPORTE URBANO
      AFRAME.registerComponent('teleport-pad', {
        schema: { targetPos: { type: 'vec3' } }, // Coordenada de destino

        init: function () {
          var el = this.el;
          var data = this.data;
          
          // Captura o Rig (movimentação global) e a Câmera (visão do jogador)
          var cameraRig = document.getElementById('rig'); 
          var camera = document.querySelector('a-camera'); 

          el.addEventListener('click', function () {
            if (cameraRig) {
              // 1. Move o Rig instantaneamente para as coordenadas absolutas
              cameraRig.object3D.position.set(
                data.targetPos.x, 
                data.targetPos.y, 
                data.targetPos.z
              );
              
              // 2. Zera qualquer deslocamento "a pé" que o jogador tenha feito 
              // (mantendo o eixo Y intacto para não afetar a altura)
              if (camera) {
                camera.object3D.position.x = 0;
                camera.object3D.position.z = 0;
              }
            }
          });
        }
      });
      AFRAME.registerComponent('mobile-joystick', {
  schema: { speed: { type: 'number', default: 15 } }, 
  
  init: function () {
    // 1. TRAVA DE SEGURANÇA: Se não for mobile, aborta a criação do joystick
    if (!AFRAME.utils.device.isMobile()) {
      this.isMobile = false;
      return; 
    }
    
    this.isMobile = true;
    this.moveData = { x: 0, y: 0 };
    
    const zone = document.createElement('div');
    zone.id = 'joystick-zone';
    document.body.appendChild(zone);

    const manager = nipplejs.create({
      zone: zone,
      mode: 'dynamic',
      color: '#38bdf8',
      size: 120
    });

    manager.on('move', (evt, data) => {
      this.moveData.x = data.vector.x;
      this.moveData.y = data.vector.y;
    });

    manager.on('end', () => {
      this.moveData.x = 0;
      this.moveData.y = 0;
    });
  },
  
  tick: function (time, timeDelta) {
    // 2. TRAVA DE SEGURANÇA: Cancela a lógica de movimento se for Desktop/VR
    if (!this.isMobile || (this.moveData.x === 0 && this.moveData.y === 0)) return;
    
    const delta = timeDelta / 1000; 
    const camera = this.el.querySelector('a-camera').object3D;
    
    const forward = new THREE.Vector3(0, 0, -1);
    forward.applyQuaternion(camera.quaternion);
    forward.y = 0; 
    forward.normalize();
    
    const right = new THREE.Vector3(1, 0, 0);
    right.applyQuaternion(camera.quaternion);
    right.y = 0;
    right.normalize();
    
    const moveDir = new THREE.Vector3();
    moveDir.addScaledVector(forward, this.moveData.y); 
    moveDir.addScaledVector(right, this.moveData.x);   
    
    if (moveDir.lengthSq() > 0) moveDir.normalize();
    
    this.el.object3D.position.addScaledVector(moveDir, this.data.speed * delta);
  }
});

      // AMPLIFICADOR DE MOVIMENTO EM VR
      // Multiplica o deslocamento físico real (rastreamento posicional do celular)
      // para que cada passo real percorra mais distância na cidade.
      // Só atua dentro de uma sessão VR ativa; não afeta o teclado (WASD) no PC.
      AFRAME.registerComponent('vr-movement-gain', {
        schema: { multiplier: { type: 'number', default: 4 } },

        init: function () {
          this.lastCamPos = new THREE.Vector3();
          this.temUltimaPos = false;
          this.deltaAcumulado = new THREE.Vector3();
        },

        tick: function () {
          if (!this.el.sceneEl.is('vr-mode')) {
            this.temUltimaPos = false;
            return;
          }

          const camera = this.el.querySelector('a-camera');
          if (!camera || !camera.object3D) return;

          const camPos = camera.object3D.position;

          if (!this.temUltimaPos) {
            this.lastCamPos.copy(camPos);
            this.temUltimaPos = true;
            return;
          }

          this.deltaAcumulado.subVectors(camPos, this.lastCamPos);
          this.deltaAcumulado.y = 0; // não amplifica agachar/levantar, só deslocamento horizontal

          if (this.deltaAcumulado.lengthSq() > 0.000001) {
            const extra = this.deltaAcumulado.clone().multiplyScalar(this.data.multiplier - 1);
            this.el.object3D.position.add(extra);
          }

          this.lastCamPos.copy(camPos);
        }
      });

      // LOCOMOÇÃO POR TOQUE EM VR (funciona mesmo sem rastreamento posicional/6DoF)
      // Segure o dedo na tela olhando para a direção desejada para andar para frente.
      // Solte para parar. Um toque rápido (tap) continua funcionando normalmente
      // para clicar em prédios/portais (cascata/teletransporte), com deslocamento
      // desprezível nesse meio tempo.
      AFRAME.registerComponent('vr-walk-locomotion', {
        schema: { speed: { type: 'number', default: 1.8 } },

        init: function () {
          this.andando = false;
          this.direcaoCam = new THREE.Vector3();
          this.anexado = false;
          this.onDown = this.onDown.bind(this);
          this.onUp = this.onUp.bind(this);
          this.tentarAnexar = this.tentarAnexar.bind(this);

          this.tentarAnexar();
          this.el.sceneEl.addEventListener('render-target-loaded', this.tentarAnexar);
        },

        tentarAnexar: function () {
          const canvas = this.el.sceneEl.canvas;
          if (!canvas || this.anexado) return;
          canvas.addEventListener('mousedown', this.onDown);
          canvas.addEventListener('touchstart', this.onDown);
          canvas.addEventListener('mouseup', this.onUp);
          canvas.addEventListener('touchend', this.onUp);
          canvas.addEventListener('touchcancel', this.onUp);
          this.anexado = true;
        },

        onDown: function () {
          if (!this.el.sceneEl.is('vr-mode')) return;
          this.andando = true;
        },

        onUp: function () {
          this.andando = false;
        },

        tick: function (time, delta) {
          if (!this.andando || !this.el.sceneEl.is('vr-mode')) return;

          const camera = this.el.querySelector('a-camera');
          if (!camera || !camera.object3D) return;

          camera.object3D.getWorldDirection(this.direcaoCam);
          this.direcaoCam.y = 0; // não voa pro chão/céu quando olha pra cima/baixo
          if (this.direcaoCam.lengthSq() < 0.0001) return;
          this.direcaoCam.normalize();

          const distancia = (this.data.speed * delta) / 1000;
          this.el.object3D.position.addScaledVector(this.direcaoCam, distancia);
        }
      });

      window.resetarCenario = function () {
        Object.keys(window.DisciplinasMap).forEach(k => {
          window.DisciplinasMap[k].resetarEstilo();
        });

        window.DisciplinaSelecionadaAtual = null;

        const hudStatus = document.getElementById('hud-status');
        const cardDetalhes = document.getElementById('card-detalhes');
        if (hudStatus) hudStatus.innerHTML = 'Clique em um pavilhão para visualizar a rede de dependências em cascata.';
        if (cardDetalhes) cardDetalhes.style.display = 'none';
      };

      window.toggleHud = function () {
        const hud = document.getElementById('vr-hud');
        const btn = document.getElementById('btn-minimizar');
        if (!hud || !btn) return;
        hud.classList.toggle('hud-minimizado');
        if (hud.classList.contains('hud-minimizado')) {
          btn.innerText = '＋';
          btn.title = 'Expandir painel';
        } else {
          btn.innerText = '－';
          btn.title = 'Minimizar painel';
        }
      };

      window.toggleModoConflito = function () {
        window.ModoConflitoAtivo = !window.ModoConflitoAtivo;
        const btn = document.getElementById('btn-conflito');
        if (btn) {
          if (window.ModoConflitoAtivo) {
